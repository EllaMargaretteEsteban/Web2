<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-load Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/controller.js"></script>
  </head>

  <body>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
        <div>
          <p class="sidebar__title">E-load Tracker</p>
          <p class="sidebar__tagline">Sari-sari wallet</p>
        </div>
      </div>

      <nav class="nav" aria-label="Main menu"></nav>

      <p class="sidebar__note"style="text-align:center;">Your data is saved on this device.</p>
    </aside>

    <main class="container">
      <!-- HOME -->
      <div class="page" data-page="home">
        <div class="topbar">
          <div>
            <p class="topbar__date topbar__date--today"></p>
            <h1 class="topbar__title">Today at a glance</h1>
          </div>
          <div class="topbar__actions">
            <button class="btn" type="button" data-nav="add">+ New sale</button>
            <button class="btn btn--secondary" type="button" data-nav="add">+ Top-up</button>
          </div>
        </div>

        <div class="low-balance"></div>
        <div class="hero"></div>
        <div class="summary"></div>

        <div class="home-grid">
          <section class="panel">
            <h2 class="panel__title">Profit by network</h2>
            <div class="breakdown"></div>
          </section>
          <section class="panel">
            <div class="panel__head">
              <h2 class="panel__title">Recent sales</h2>
              <button class="link" type="button" data-nav="history">View all</button>
            </div>
            <div class="recent"></div>
          </section>
        </div>
      </div>

      <!-- ADD -->
      <div class="page" data-page="add">
        <div class="topbar">
          <div>
            <p class="topbar__date">Record</p>
            <h1 class="topbar__title">Add a sale or top-up</h1>
          </div>
        </div>
        <section class="forms">
          <div class="card card--wallet">
            <h2 class="card__title">Wallet top-up</h2>
            <div class="wallet-form"></div>
          </div>
          <div class="card card--sale">
            <h2 class="card__title">E-load sale</h2>
            <div class="sale-form"></div>
          </div>
        </section>
      </div>

      <!-- HISTORY -->
      <div class="page" data-page="history">
        <div class="topbar">
          <div>
            <p class="topbar__date">Records</p>
            <h1 class="topbar__title">History</h1>
          </div>
        </div>
        <div class="history-grid">
          <section>
            <div class="filter-bar"></div>
            <div class="sale-list"></div>
          </section>
          <aside class="card card--topups">
            <h2 class="card__title">Top-ups</h2>
            <div class="topup-list"></div>
          </aside>
        </div>
      </div>

      <!-- SETTINGS -->
      <div class="page" data-page="settings">
        <div class="topbar">
          <div>
            <p class="topbar__date">Preferences</p>
            <h1 class="topbar__title">Settings</h1>
          </div>
        </div>
        <section class="settings-section">
          <div class="card card--settings">
            <div class="settings"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>E-load Tracker Your data is saved on this device.</p>
    </footer>
  </body>
</html>
